<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeviceIdentityOps</title>
<style>
  :root {
    --bg: #f3f2f1;
    --card-bg: #ffffff;
    --text: #201f1e;
    --text-muted: #605e5c;
    --border: #edebe9;
    --accent: #0078d4;
    --good: #107c10;
    --good-bg: #dff6dd;
    --bad: #a4262c;
    --bad-bg: #fde7e9;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 32px;
  }
  h1 { font-weight: 600; margin: 0 0 4px 0; }
  .subtitle { color: var(--text-muted); margin: 0 0 24px 0; font-size: 14px; }

  /* Executive health bar */
  .health-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 32px;
  }
  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
  }
  .stat-card .value { font-size: 28px; font-weight: 600; }
  .stat-card .label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

  section { margin-bottom: 32px; }
  h2 { font-size: 16px; font-weight: 600; margin: 0 0 12px 0; }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    font-size: 14px;
  }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  th { background: #faf9f8; font-weight: 600; color: var(--text-muted); font-size: 12px; text-transform: uppercase; }
  tr:last-child td { border-bottom: none; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover { background: #f3f2f1; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
  .badge.good { background: var(--good-bg); color: var(--good); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); }

  .detail-panel {
    display: none;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    margin-top: 12px;
    font-size: 14px;
  }
  .detail-panel.open { display: block; }
  .detail-panel .explanation { margin-top: 8px; color: var(--text-muted); }

  form {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 10px;
    align-items: end;
  }
  label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  input, select {
    width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 14px;
  }
  button {
    background: var(--accent); color: white; border: none; border-radius: 4px;
    padding: 9px 16px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #106ebe; }
  button.secondary { background: white; color: var(--accent); border: 1px solid var(--accent); }
  button.secondary:hover { background: #f3f9fd; }

  .actions-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .result-msg { margin-top: 10px; font-size: 14px; padding: 10px; border-radius: 4px; }
  .result-msg.success { background: var(--good-bg); color: var(--good); }
  .result-msg.error { background: var(--bad-bg); color: var(--bad); }
</style>
</head>
<body>

<h1>DeviceIdentityOps</h1>
<p class="subtitle">Device management, identity lifecycle, and audit trail on top of Microsoft 365 / Entra ID / Intune.</p>

<div class="health-bar" id="healthBar"></div>

<section>
  <h2>Devices</h2>
  <table id="deviceTable">
    <thead>
      <tr><th>Hostname</th><th>User</th><th>OS</th><th>Type</th><th>Compliance</th><th>Encryption</th><th>Management</th><th></th></tr>
    </thead>
    <tbody id="deviceRows"></tbody>
  </table>
  <div class="detail-panel" id="deviceDetail"></div>
</section>

<section>
  <h2>Deploy New Device</h2>
  <form id="deployForm">
    <div>
      <label>Serial Number</label>
      <input type="text" id="serialNumber" required>
    </div>
    <div>
      <label>Assigned User</label>
      <input type="text" id="assignedUser" required placeholder="name@example.com">
    </div>
    <div>
      <label>Department</label>
      <select id="department">
        <option>Engineering</option>
        <option>Sales</option>
        <option>Operations</option>
        <option>HR</option>
        <option>Finance</option>
      </select>
    </div>
    <div>
      <label>Device Type</label>
      <input type="text" id="deviceType" required placeholder="Laptop">
    </div>
    <div>
      <button type="submit">Deploy Device</button>
    </div>
  </form>
  <div id="deployResult"></div>
</section>

<section>
  <h2>Onboarding / Offboarding</h2>
  <div class="actions-row">
    <button class="secondary" id="processOnboarding">Process Onboarding Requests</button>
    <button class="secondary" id="processOffboarding">Process Offboarding Requests</button>
  </div>
  <div id="processResult"></div>
</section>

<section>
  <h2>Audit Log</h2>
  <table id="auditTable">
    <thead>
      <tr><th>Timestamp</th><th>Action</th><th>Target</th><th>Result</th></tr>
    </thead>
    <tbody id="auditRows"></tbody>
  </table>
</section>

<script>
async function fetchJSON(url, options) {
  const res = await fetch(url, options);
  return res.json();
}

function explainCompliance(device) {
  const issues = [];
  if (device.compliance_status === "Non-Compliant") issues.push("device is flagged non-compliant by Intune");
  if (device.encryption_status === "Not Encrypted") issues.push("BitLocker encryption is not active");
  if (issues.length === 0) return "No issues - device meets baseline policy.";
  return "Failed checks: " + issues.join("; ") + ". Recommended: verify Defender status and re-run BitLocker enablement, then check compliance again in Intune.";
}

async function removeDevice(id) {
  if (!confirm("Remove this device from DeviceIdentityOps?")) return;
  await fetch(`/api/devices/${id}`, { method: "DELETE" });
  loadDevices();
  loadAudit();
}

async function loadDevices() {
  const devices = await fetchJSON("/api/devices");
  const rows = document.getElementById("deviceRows");
  rows.innerHTML = "";
  devices.forEach(d => {
    const tr = document.createElement("tr");
    tr.className = "clickable";
    tr.innerHTML = `
      <td>${d.hostname}</td>
      <td>${d.assigned_user || "-"}</td>
      <td>${d.os}</td>
      <td>${d.device_type || "-"}</td>
      <td><span class="badge ${d.compliance_status === 'Compliant' ? 'good' : 'bad'}">${d.compliance_status}</span></td>
      <td><span class="badge ${d.encryption_status === 'Encrypted' ? 'good' : 'bad'}">${d.encryption_status}</span></td>
      <td>${d.management_status}</td>
      <td><button class="secondary" style="padding:4px 10px;font-size:12px;" onclick="event.stopPropagation(); removeDevice(${d.id})">Remove</button></td>
    `;
    tr.onclick = () => {
      const panel = document.getElementById("deviceDetail");
      panel.innerHTML = `
        <strong>${d.hostname}</strong> - last check-in: ${d.last_checkin}
        <div class="explanation">${explainCompliance(d)}</div>
      `;
      panel.classList.add("open");
    };
    rows.appendChild(tr);
  });

  const compliant = devices.filter(d => d.compliance_status === "Compliant").length;
  const nonCompliant = devices.length - compliant;
  document.getElementById("healthBar").innerHTML = `
    <div class="stat-card"><div class="value">${devices.length}</div><div class="label">Total Devices</div></div>
    <div class="stat-card"><div class="value">${compliant}</div><div class="label">Compliant</div></div>
    <div class="stat-card"><div class="value">${nonCompliant}</div><div class="label">Non-Compliant</div></div>
    <div class="stat-card"><div class="value" id="actionsToday">-</div><div class="label">Audit Actions Logged</div></div>
  `;
}

async function loadAudit() {
  const entries = await fetchJSON("/api/audit");
  const rows = document.getElementById("auditRows");
  rows.innerHTML = "";
  entries.forEach(e => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${e.timestamp}</td>
      <td>${e.action_type}</td>
      <td>${e.target}</td>
      <td><span class="badge ${e.result === 'SUCCESS' ? 'good' : 'bad'}">${e.result}</span></td>
    `;
    rows.appendChild(tr);
  });
  const actionsEl = document.getElementById("actionsToday");
  if (actionsEl) actionsEl.textContent = entries.length;
}

document.getElementById("deployForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const body = {
    serial_number: document.getElementById("serialNumber").value,
    assigned_user: document.getElementById("assignedUser").value,
    department: document.getElementById("department").value,
    device_type: document.getElementById("deviceType").value,
  };
  const result = await fetchJSON("/api/devices/deploy", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const el = document.getElementById("deployResult");
  el.innerHTML = `<div class="result-msg ${result.success ? 'success' : 'error'}">${result.message}${result.policy_assigned ? ' - policy: ' + result.policy_assigned : ''}${result.dry_run ? ' (dry-run)' : ''}</div>`;
  if (result.success) {
    document.getElementById("deployForm").reset();
    loadDevices();
    loadAudit();
  }
});

document.getElementById("processOnboarding").addEventListener("click", async () => {
  const result = await fetchJSON("/api/onboarding/process", { method: "POST" });
  document.getElementById("processResult").innerHTML =
    `<div class="result-msg success">Onboarding: ${result.results.join("; ")}</div>`;
  loadAudit();
});

document.getElementById("processOffboarding").addEventListener("click", async () => {
  const result = await fetchJSON("/api/offboarding/process", { method: "POST" });
  document.getElementById("processResult").innerHTML =
    `<div class="result-msg success">Offboarding: ${result.results.join("; ")}</div>`;
  loadAudit();
});

loadDevices();
loadAudit();
</script>
</body>
</html>
